[package]
name = "MillenniumCore"
version = "0.1.0"
keywords = ["mathematics", "foundations", "indeterminates", "lean4"]
description = "Theory of Indeterminates Framework (TIF) — Core Lean 4 mechanization"

[[require]]
name = "mathlib"
from = "git"
url = "https://github.com/leanprover-community/mathlib4"
rev = "v4.14.0"

[[lean_lib]]
name = "Core"
name = "MilleniumCore"
version = "0.1.0"
defaultTargets = ["MilleniumCore"]

[[lean_lib]]
name = "Core"
roots = ["Core"]

[[lean_lib]]
name = "Toy"
roots = ["Toy"]
